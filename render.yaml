services:
  - type: web
    name: cliniccare-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build -w packages/shared-types && npm run build -w apps/api
    startCommand: npm run start:prod -w apps/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/data/clinic.db
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: FRONTEND_URL
        sync: false
    disk:
      name: cliniccare-data
      mountPath: /data
      sizeGB: 1
