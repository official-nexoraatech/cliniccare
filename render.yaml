services:
  - type: web
    name: cliniccare-api
    runtime: node
    plan: free
    # --include=dev is required here even though NODE_ENV=production is set below:
    # npm normally skips devDependencies when NODE_ENV=production, but @nestjs/cli,
    # typescript, and prisma (all needed just to BUILD the app) live in devDependencies.
    # prisma generate must run explicitly too — on a fresh checkout there's no prior
    # local run to have already generated the typed client for our actual schema.
    buildCommand: npm install --include=dev && npm run prisma:generate -w apps/api && npm run build -w packages/shared-types && npm run build -w apps/api
    startCommand: npm run start:prod -w apps/api
    envVars:
      - key: NODE_ENV
        value: production
      # Set manually in the Render dashboard to the Atlas connection string — not
      # committed here (it's a credential). sync: false stops Render's Blueprint sync
      # from overwriting whatever's set there on every deploy.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: FRONTEND_URL
        sync: false
